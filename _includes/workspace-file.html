<article class="workspace-file" data-file-date="{{ include.post.date | date: '%s' }}" data-file-title="{{ include.post.title | escape }}">
  <i class="workspace-file-icon fa-regular fa-file-lines" aria-hidden="true"></i>
  <div class="workspace-file-body">
    <h{{ include.level }}><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h{{ include.level }}>
    <div class="workspace-file-meta">
      {% if include.show_categories and include.post.categories.size > 0 %}
        <div class="workspace-topic">{% include workspace-categories.html categories=include.post.categories %}</div>
      {% endif %}
      {% include workspace-tags.html tags=include.post.tags %}
    </div>
  </div>
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
</article>
