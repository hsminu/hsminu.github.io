<div class="journal-figure" aria-hidden="true">
  <svg viewBox="0 0 620 238" focusable="false">
    <defs>
      <linearGradient id="journal-curve-visibility">
        <stop offset="0" stop-color="white" stop-opacity="0"/>
        <stop offset=".23" stop-color="white" stop-opacity=".48"/>
        <stop offset=".57" stop-color="white"/>
        <stop offset=".86" stop-color="white" stop-opacity=".86"/>
        <stop offset="1" stop-color="white" stop-opacity=".3"/>
      </linearGradient>
      <mask id="journal-curve-mask" maskUnits="userSpaceOnUse">
        <rect width="620" height="238" fill="url(#journal-curve-visibility)"/>
      </mask>
      <linearGradient id="journal-accent-visibility">
        <stop offset="0" stop-color="var(--journal-art-accent)" stop-opacity="0"/>
        <stop offset=".55" stop-color="var(--journal-art-accent)" stop-opacity=".9"/>
        <stop offset="1" stop-color="var(--journal-art-accent)" stop-opacity=".2"/>
      </linearGradient>
    </defs>
    <g mask="url(#journal-curve-mask)">
      <g class="journal-curve-field">
        <g class="journal-curve-primary">
          {% for band in (0..24) %}
            {% assign y0 = band | times: 2 | plus: 154 %}
            {% assign y1 = band | times: 5 | minus: 96 %}
            {% assign y2 = band | times: 3 | plus: 36 %}
            {% assign y3 = band | times: 2 | plus: 102 %}
            {% assign y4 = band | times: 5 | plus: 102 %}
            {% assign y5 = band | times: 7 | plus: 36 %}
            <path d="M-16 {{ y0 }} C135 {{ y1 }} 229 {{ y2 }} 334 {{ y3 }} S544 {{ y4 }} 649 {{ y5 }}"/>
          {% endfor %}
        </g>
        <g class="journal-curve-secondary">
          {% for band in (0..15) %}
            {% assign y0 = band | times: 3 | plus: 221 %}
            {% assign y1 = band | times: 4 | plus: 160 %}
            {% assign y2 = band | times: 2 | plus: 103 %}
            {% assign y3 = band | times: 7 | minus: 56 %}
            <path d="M8 {{ y0 }} C170 275 257 {{ y1 }} 357 {{ y2 }} S525 239 636 {{ y3 }}"/>
          {% endfor %}
        </g>
        <path class="journal-curve-accent" d="M-16 194 C112 160 205 53 335 113 C368 128 395 147 425 147 C475 147 541 191 649 150"/>
        <circle class="journal-curve-ring" cx="425" cy="147" r="12"/>
        <circle class="journal-curve-node" cx="425" cy="147" r="3.1"/>
      </g>
    </g>
  </svg>
</div>
