<dialog class="workspace-spotlight" id="workspace-spotlight" aria-label="Workspace search" data-index="{{ '/assets/js/data/search.json' | relative_url }}">
  <div class="spotlight-query">
    {% include workspace-icon.html name='search' %}
    <input type="search" id="workspace-query" role="combobox" aria-label="Search posts, categories, and pages" aria-autocomplete="list" aria-expanded="false" aria-controls="workspace-results" placeholder="Search posts, categories, and pages" autocomplete="off" spellcheck="false" autofocus>
    <button type="button" class="workspace-icon-button" data-close-search aria-label="Close search">{% include workspace-icon.html name='close' %}</button>
  </div>
  <p class="spotlight-status" role="status"></p>
  <ul id="workspace-results" class="spotlight-results" role="listbox" aria-label="Search results"></ul>
  <div class="spotlight-footer" aria-hidden="true"><span><kbd>↑</kbd> <kbd>↓</kbd> Select</span><span><kbd>↵</kbd> Open</span><span><kbd>Esc</kbd> Close</span></div>
</dialog>
{% comment %} Chirpy bundles the legacy search controller with theme and document features. Keep its DOM hooks isolated from Spotlight. {% endcomment %}
<div hidden inert>
  <button id="search-trigger" type="button"></button>
  <button id="search-cancel" type="button"></button>
  <span id="topbar-title"></span>
  <div id="search"><input id="search-input"></div>
  <div id="search-result-wrapper" class="d-none"><div id="search-hints"></div><div id="search-results"></div></div>
</div>
