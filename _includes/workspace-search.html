<dialog class="workspace-spotlight" id="workspace-spotlight" aria-label="Workspace search" data-index="{{ '/assets/js/data/search.json' | relative_url }}?v={{ site.time | date: '%s%N' }}">
  <div class="spotlight-query">
    {% include workspace-icon.html name='search' %}
    <input type="search" id="workspace-query" role="combobox" aria-label="Search posts, categories, tags, and pages" aria-autocomplete="list" aria-expanded="false" aria-controls="workspace-results" placeholder="Search" autocomplete="off" spellcheck="false" autofocus>
    <button type="button" class="workspace-icon-button" data-close-search aria-label="Close search">{% include workspace-icon.html name='close' %}</button>
  </div>
  <div class="spotlight-scroll">
    <div id="workspace-results" class="spotlight-results" role="listbox" aria-label="Search results" hidden></div>
    <div class="spotlight-message" data-search-message hidden>
      <div role="status"><strong></strong><p hidden></p></div>
      <button type="button" data-search-retry hidden>Try again</button>
    </div>
  </div>
  <div class="spotlight-footer">
    <div class="spotlight-keys" aria-hidden="true"><span><kbd>↑ ↓</kbd> Select</span><span><kbd>↵</kbd> Open</span><span><kbd>Esc</kbd> Close</span></div>
    <span class="spotlight-count" role="status" aria-atomic="true"></span>
  </div>
</dialog>
{% comment %} Chirpy bundles the legacy search controller with theme and document features. Keep its DOM hooks isolated from Spotlight. {% endcomment %}
<div hidden inert>
  <button id="search-trigger" type="button"></button>
  <button id="search-cancel" type="button"></button>
  <span id="topbar-title"></span>
  <div id="search"><input id="search-input"></div>
  <div id="search-result-wrapper" class="d-none"><div id="search-hints"></div><div id="search-results"></div></div>
</div>
