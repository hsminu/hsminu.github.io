<dialog class="workspace-spotlight" id="workspace-spotlight" aria-label="워크스페이스 검색" data-index="{{ '/assets/js/data/search.json' | relative_url }}">
  <div class="spotlight-query">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <input type="search" id="workspace-query" role="combobox" aria-label="게시글, 카테고리, 페이지 검색" aria-autocomplete="list" aria-expanded="false" aria-controls="workspace-results" placeholder="게시글, 카테고리, 페이지 검색" autocomplete="off" spellcheck="false" autofocus>
    <button type="button" class="workspace-icon-button" data-close-search aria-label="검색 닫기"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </div>
  <p class="spotlight-status" role="status"></p>
  <ul id="workspace-results" class="spotlight-results" role="listbox" aria-label="검색 결과"></ul>
  <div class="spotlight-footer" aria-hidden="true"><span><kbd>↑</kbd> <kbd>↓</kbd> 선택</span><span><kbd>↵</kbd> 열기</span><span><kbd>esc</kbd> 닫기</span></div>
</dialog>
{% comment %} Chirpy bundles the legacy search controller with theme and document features. Keep its DOM hooks isolated from Spotlight. {% endcomment %}
<div hidden inert>
  <button id="search-trigger" type="button"></button>
  <button id="search-cancel" type="button"></button>
  <span id="topbar-title"></span>
  <div id="search"><input id="search-input"></div>
  <div id="search-result-wrapper" class="d-none"><div id="search-hints"></div><div id="search-results"></div></div>
</div>
