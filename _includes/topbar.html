<header class="workspace-toolbar">
  <div class="workspace-toolbar-start">
    <button id="sidebar-trigger" class="workspace-icon-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle sidebar" title="Toggle sidebar">
      {% include workspace-icon.html name='layout' %}
    </button>
    {% include workspace-parent.html icon_only=true %}
  </div>
  <a class="workspace-toolbar-title" href="{{ '/' | relative_url }}">
    {% if page.layout == 'home' or page.layout == 'post' %}{{ site.title | escape }}{% else %}{{ page.ui_title | default: page.title | default: site.title | escape }}{% endif %}
  </a>
  <button class="workspace-icon-button workspace-search-trigger" type="button" data-workspace-search aria-label="Open search" aria-haspopup="dialog" title="Search">
    {% include workspace-icon.html name='search' %}
  </button>
</header>
