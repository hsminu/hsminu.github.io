<header class="workspace-toolbar">
  <div class="workspace-toolbar-start">
    <button id="sidebar-trigger" class="workspace-icon-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="탐색 메뉴">
      <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
    </button>
    <a class="workspace-mark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 홈">h<span>.</span></a>
  </div>
  <a class="workspace-toolbar-title" href="{{ '/' | relative_url }}">{{ site.title | escape }} <span> / </span> Research Workspace</a>
  <button class="workspace-icon-button workspace-search-trigger" type="button" data-workspace-search aria-label="검색 열기" aria-keyshortcuts="Meta+K Control+K" aria-haspopup="dialog">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
  </button>
</header>
